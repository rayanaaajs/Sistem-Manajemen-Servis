<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Sandi - Singhasari Computer</title>
    <!-- Google Fonts: Full Poppins (Weights: 300, 400, 500, 600, 700, 800, 900) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS & Custom Style CSS -->
    <link rel="stylesheet" href="assets/css/tailwind.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-orange-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-sm p-8 text-center">
      <!-- Logo Dummy -->
      <div
        class="mx-auto w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mb-6"
      >
        <svg
          class="w-8 h-8 text-brand-orange"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          ></path>
        </svg>
      </div>

      <h2 class="text-2xl font-bold text-gray-800 mb-2">Lupa Kata Sandi?</h2>
      <p class="text-gray-500 text-sm mb-6">
        Masukkan email yang terdaftar, dan kami akan kirimkan link untuk
        mengatur ulang kata sandi kamu.
      </p>

      <form action="#" method="POST" class="space-y-4">
        <div class="text-left">
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Email Anda</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="admin@singhasari.com"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-1 focus:border-transparent transition-all custom-input"
          />
        </div>

        <button
          type="submit"
          class="w-full mt-5 btn-submit"
        >
          Kirim Link Reset
        </button>
      </form>

      <div class="mt-6">
        <a
          href="login.html"
          class="text-sm text-brand-orange hover:text-brand-orange-hover font-medium"
        >
          &larr; Kembali ke halaman Login
        </a>
      </div>
    </div>
  </body>
</html>
